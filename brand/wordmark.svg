<svg width="320" height="96" viewBox="0 0 320 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pier">
  <title>Pier</title>
  <desc>The Pier mark tile locked up with the "Pier" wordmark.</desc>
  <!-- mark tile, scaled into a 72px tile; flat ground, per the product-logo standard -->
  <svg x="8" y="12" width="72" height="72" viewBox="0 0 128 128">
    <rect width="128" height="128" rx="28" fill="#14100A"/>
    <svg x="22" y="32.5" width="84" height="63" viewBox="0 0 88 66">
      <g stroke="#C89A56" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M4 4 H72"/>
        <path d="M12 4 V40"/>
        <path d="M38 4 V40"/>
        <path d="M64 4 V40"/>
        <path d="M4 58 Q14 52 24 58 Q34 64 44 58 Q54 52 64 58 Q74 64 84 58"/>
      </g>
    </svg>
  </svg>
  <!-- WORDMARK — DRAWN, NOT TYPESET.
       These are stroked <path> letterforms, not an SVG <text> node. That is deliberate and
       load-bearing: a <text> node renders with whatever font the viewing machine happens to
       resolve, so the "logo" is a different shape on every device and in every rasteriser.
       The suite retired exactly this construction once before — zana's logo-wordmark*.svg
       were DELETED for it — so reintroducing it here was a regression against a standing
       decision, not a fresh tradeoff. Drawn paths are byte-identical everywhere and carry
       no font licence.
       The letters speak the mark's own language: 8-unit strokes, round caps, same bronze,
       so the wordmark and the tile read as one drawing rather than a picture next to a font.
       Local grid: cap-top y=0, baseline y=46, x-height top y=22; stroke centres inset 4. -->
  <g transform="translate(100 25)" stroke="#8B5A2B" stroke-width="8" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <!-- P — stem, plus a bowl that closes back onto it -->
    <path d="M4 4 V46"/>
    <path d="M4 4 H17 A11 11 0 0 1 17 26 H4"/>
    <!-- i — a zero-length stroke renders as a round-cap disc: the tittle -->
    <path d="M46 8 V8"/>
    <path d="M46 22 V46"/>
    <!-- e — crossbar, then 320 degrees of bowl, left open at the lower right -->
    <path d="M63 34 H85"/>
    <path d="M85 34 A11 11 0 1 0 82.4 41.1"/>
    <!-- r — stem, plus a shoulder that lifts and stops, the way the wave stops -->
    <path d="M100 22 V46"/>
    <path d="M100 30 Q100 22 112 22"/>
  </g>
</svg>
