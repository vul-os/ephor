<svg width="320" height="96" viewBox="0 0 320 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pier">
  <title>Pier</title>
  <desc>The Pier mark tile locked up with the "Pier" wordmark.</desc>
  <!-- mark tile, scaled into a 72px tile; flat ground, per the product-logo standard -->
  <svg x="8" y="12" width="72" height="72" viewBox="0 0 128 128">
    <rect width="128" height="128" rx="28" fill="#14100A"/>
    <svg x="22" y="32.5" width="84" height="63" viewBox="0 0 88 66">
      <g stroke="#C89A56" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M4 4 H72"/>
        <path d="M12 4 V40"/>
        <path d="M38 4 V40"/>
        <path d="M64 4 V40"/>
        <path d="M4 58 Q14 52 24 58 Q34 64 44 58 Q54 52 64 58 Q74 64 84 58"/>
      </g>
    </svg>
  </svg>
  <!-- wordmark: no external fonts — system UI stack only. A deeper bronze-ink than the
       mark's bright accent, tuned for legibility on light navbars/headers. -->
  <text x="96" y="61" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="46" font-weight="700" letter-spacing="-1" fill="#8B5A2B">Pier</text>
</svg>
