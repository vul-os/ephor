<svg viewBox="0 0 88 66" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pier">
  <title>Pier (monochrome)</title>
  <desc>The Pier deck-pilings-and-water mark in a single colour via currentColor, for use on light or dark surfaces.</desc>
  <!-- Identical geometry to pier.svg. The mark is single-colour by design, so
       there is no "mono reduction" to make — this file exists only to name the
       one-ink use (print, watermarks, embroidery). Set `color` on the parent. -->
