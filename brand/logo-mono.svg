    <path d="M4 4 H72"/>
    <path d="M12 4 V40"/>
    <path d="M38 4 V40"/>
    <path d="M64 4 V40"/>
    <path d="M4 58 Q14 52 24 58 Q34 64 44 58 Q54 52 64 58 Q74 64 84 58"/>
  </g>
</svg>
