<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pier">
  <title>Pier</title>
  <!-- Favicon variant: the mark is enlarged within the tile (96/128 vs the
       standard 84/128) so the gap between the pilings' feet and the water
       still reads as a gap at 16px, and the wave still visibly waves. Below
       that gap the mark stops being a pier and starts being a table. -->
  <rect width="128" height="128" rx="26" fill="#14100A"/>
  <svg x="16" y="28" width="96" height="72" viewBox="0 0 88 66">
    <g stroke="#C89A56" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M4 4 H72"/>
      <path d="M12 4 V40"/>
      <path d="M38 4 V40"/>
      <path d="M64 4 V40"/>
      <path d="M4 58 Q14 52 24 58 Q34 64 44 58 Q54 52 64 58 Q74 64 84 58"/>
    </g>
  </svg>
</svg>
