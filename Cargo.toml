# Pier — the broker (coordinator) reference implementation of the KOTVA standard.
#
# This is a virtual workspace: one crate per coordinator *kind* plus the shared
# `pier-economics` crate (the content-visibility model, authz, tariff, usage
# receipts) and the `pier-conformance` harness (the CONTRACT COORD-1..8 checks).
#
# The Go reverse-tunnel relay + JS client SDK are preserved untouched alongside
# this (HANDOVER §Guardrails-3) until the Rust port is proven.
#
# Substrate types (MOTE, envelope, identity/naming, PUB, SYNC, signing/DS-tags,
# MLS glue, CBOR, crypto) come from `kotva-core`, a crate carved from envoir and
# pinned by tag — NEVER tracked at HEAD (the isango guardrail, HANDOVER §Guardrails-1).
# `kotva-core` is tag-pinned at `core-v0.2.0`; every crate that needs it (currently
# `pier-economics`, `pier-gateway`) depends on that exact tag directly (see each crate's
# own Cargo.toml — not unified here via `[workspace.dependencies]`, so a future retag
# is a per-crate, reviewable bump rather than one silent workspace-wide jump).

[workspace]
resolver = "2"
members = [
    "crates/pier-economics",
    "crates/pier-billing",
    "crates/pier-conformance",
    "crates/pier-reachability-adapter",
    "crates/pier-gateway",
    "crates/pier-admin",
    "crates/pier-relay",
    "crates/pier-media-relay",
    "crates/pier-indexer",
    "crates/pier-labeler",
    "crates/pier-matcher",
    "crates/pier-arbiter",
    "crates/pier-oracle",
    "crates/pier-infra-service",
]

# `crates/pier-billing-patala` is EXCLUDED from this workspace (it is its own single-crate
# workspace — see its Cargo.toml). It is an OPTIONAL reference `SettlementRail` adapter for
# `pier-billing`'s provider-agnostic settlement seam — never a hard dependency of
# `pier-billing` or any coordinator kind — and it path-depends on the SIBLING `patala` repo
# (`../../../patala/{patala-core,patala-stellar}`), which is not part of this repo and is not
# present in a fresh checkout.
#
# It used to be a real member kept out of `default-members` (the trick envoir's
# `dmtap-postage-patala` and patala's own workspace use). That is enough to keep patala out of
# what gets COMPILED, but NOT out of what gets RESOLVED: cargo loads every member manifest
# eagerly, so with the adapter listed as a member, `cargo build` at this root fails outright with
# "failed to load manifest for workspace member ... failed to read ../../../patala/patala-core/
# Cargo.toml" on any machine without the sibling repo checked out next to pier. That made a
# standalone Rust CI job impossible; hence `exclude`. Verified by building this repo in a
# worktree with no patala sibling on disk.
#
# Consequence, and the reason the docs changed with it: `-p pier-billing-patala` and
# `--workspace` no longer reach the adapter from this root. Build/test it explicitly, with the
# sibling repo present:
#
#     cargo test --manifest-path crates/pier-billing-patala/Cargo.toml
#
# `pier-billing` alone stays the default, patala-free settlement seam (see
# `crates/pier-billing/src/settlement.rs`).
#
# `default-members` is deliberately absent now: members == default-members, so `--workspace` and a
# bare `cargo build` cover exactly the same 14 crates and cannot drift apart.
exclude = ["crates/pier-billing-patala"]

[workspace.package]
# PUBLISH RULE (enforced, not advisory — see scripts/check-no-publish.sh):
# This repo publishes NOTHING to crates.io. It is the reference *implementation*; the published,
# semver-stable, tag-pinned artefacts are the `kotva-*` crates in the kotva repo, which this repo
# CONSUMES. Two reasons this is a rule and not a preference:
#   1. Spec-defined wire objects must have exactly ONE published home, or two implementations can
#      encode the same object differently and both believe they are conformant.
#   2. A published crate name can be yanked but never released, so publishing from here would
#      permanently reserve names for an implementation that is meant to be replaceable.
# A crate here that needs to be depended on from outside belongs in kotva instead. Adding
# `publish = true` to any member is a design change, not a release step.
publish = false
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vul-os/pier"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

# Pinned once kotva-core is carved + tagged (HANDOVER §Guardrails-1):
# [workspace.dependencies]
# kotva-core = { git = "https://github.com/vul-os/kotva", tag = "core-vX.Y.Z" }
