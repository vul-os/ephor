<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      No <title>, <meta name="description"> or <link rel="icon"> here on purpose:
      all three are branding sites, and all three are injected at build time by
      the `brand-html` plugin in vite.config.ts from src/brands/<VITE_BRAND>.ts.
      Hardcoding them would mean a rebranded deployment shipping someone else's
      name in the browser tab.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
