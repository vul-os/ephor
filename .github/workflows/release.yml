name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub Releases + upload assets
  id-token: write   # npm --provenance (OIDC)
  packages: write   # push the vulos-relayd image to GHCR

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Verify the tag version matches package.json. Example: tag v1.2.3 must
      # match "version": "1.2.3" so we never publish a mismatched package.
      - name: Check tag/package version match
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      # Archive dist-lib/ so the GitHub Release step can attach it.
      # Output path ../relay-client-*.tar.gz lands at the repo root (one level
      # above the client/ default working-directory) where upload-artifact picks
      # it up by its bare filename (upload-artifact paths are relative to
      # $GITHUB_WORKSPACE, i.e. the repo root).
      - name: Archive dist-lib
        run: |
          tar -czf ../relay-client-${{ github.ref_name }}-dist.tar.gz dist-lib/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-lib
          path: relay-client-${{ github.ref_name }}-dist.tar.gz
          retention-days: 1

  check-npm-token:
    name: Check NPM_TOKEN availability
    needs: build-and-test
    runs-on: ubuntu-24.04
    outputs:
      has_token: ${{ steps.probe.outputs.has_token }}
    steps:
      # Secrets cannot be read in `if:` expressions directly — map to an output
      # first, then condition the publish job on that output.
      - name: Probe for NPM_TOKEN
        id: probe
        run: |
          if [ -n "$NPM_TOKEN_VAL" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NPM_TOKEN_VAL: ${{ secrets.NPM_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: check-npm-token
    runs-on: ubuntu-24.04
    # Gate on the output produced by check-npm-token, not on the secret
    # expression directly (secret expressions always evaluate to empty in
    # `if:` conditions, so `secrets.NPM_TOKEN != ''` never works).
    if: needs.check-npm-token.outputs.has_token == 'true'
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node (with npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        # --provenance attaches an OIDC-signed build provenance attestation to
        # the published package. Requires id-token: write at the workflow level.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-image:
    name: Publish vulos-relayd image (GHCR)
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The relay Dockerfile is self-contained (pure-Go, no sibling repos), so
      # the repo root is a coherent build context — build straight from it.
      - name: Build & push vulos-relayd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          # Tag both the version and :latest so fly.toml's :latest reference and
          # pinned deploys both resolve.
          tags: |
            ghcr.io/vul-os/vulos-relayd:${{ github.ref_name }}
            ghcr.io/vul-os/vulos-relayd:latest

  # ===========================================================================
  # RELEASE-SIGNING TEMPLATE — copy this job together with scripts/verify.sh.
  # See RELEASE-TEMPLATE.md. The two files are a matched pair: this job is the
  # only thing that writes SHA256SUMS, verify.sh is the only thing that reads
  # it, and this job runs verify.sh against its own output before publishing,
  # so producer and consumer cannot drift apart silently.
  #
  # WHY ATTESTATION AND NOT A DETACHED GPG SIGNATURE
  # ------------------------------------------------
  # A detached signature needs a private key. That key needs somewhere to live
  # (a repo secret), an owner, a rotation story, and a published public half
  # that users must obtain over some channel they already trust — and if that
  # channel is "the same GitHub repo", the signature proves nothing a TLS fetch
  # did not already prove. Every one of those is a standing obligation, and an
  # unrotated key nobody owns is the normal end state.
  #
  # actions/attest-build-provenance signs with a short-lived sigstore
  # certificate minted from this workflow's OIDC token: no long-lived key, no
  # new secret, no new hosted service, and the identity it binds is
  # "vul-os/pier's release workflow at this commit" rather than "whoever holds
  # the key". Users check it with `gh attestation verify`, which they already
  # have if they use GitHub at all.
  #
  # It is deliberately NOT load-bearing. verify.sh's digest path needs only
  # curl and sha256sum; --attest is opt-in. If this action is ever removed or
  # broken, SHA256SUMS still verifies and no user's verification silently
  # turns into a no-op.
  # ===========================================================================
  github-release:
    name: Create GitHub Release (checksummed + attested)
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the Release and upload assets
      id-token: write       # mint the OIDC token the attestation is signed with
      attestations: write   # record the attestation against this repo
    steps:
      # verify.sh is used below to check this job's own output, so the repo has
      # to be present.
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Everything that will be published lands in release/ and nothing else
      # does. The manifest covers that directory, so "published" and "covered"
      # are the same set by construction rather than by two lists kept in sync.
      - name: Stage published artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-lib
          path: release

      - name: Emit SHA256SUMS
        run: |
          set -euo pipefail
          cd release

          # Portable listing (no find -printf): the staging dir is flat by
          # construction, one line per asset, sorted so the manifest is
          # reproducible.
          mapfile -t ASSETS < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -exec basename {} \; | LC_ALL=C sort)

          # FAIL CLOSED. A build that produced nothing must be a red release,
          # not a green one with an empty manifest. An empty SHA256SUMS vouches
          # for nothing while looking exactly like a manifest that vouched for
          # everything.
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::release/ contains no artifacts — refusing to publish a release whose manifest would vouch for nothing."
            exit 1
          fi

          : > SHA256SUMS
          for a in "${ASSETS[@]}"; do
            sha256sum "$a" >> SHA256SUMS
          done

          # COVERAGE ASSERTION. Without this the step is trivially satisfiable:
          # a manifest with one line "covers" a ten-asset release and every
          # later check still passes. Pin line count to asset count.
          # tr: BSD wc pads its output with spaces; the arithmetic test copes
          # but the error message would print "        1 line(s)".
          LINES="$(wc -l < SHA256SUMS | tr -d ' ')"
          if [ "$LINES" -ne "${#ASSETS[@]}" ]; then
            echo "::error::SHA256SUMS has ${LINES} line(s) for ${#ASSETS[@]} staged artifact(s) — the manifest does not cover the release."
            exit 1
          fi

          echo "SHA256SUMS covers ${#ASSETS[@]} artifact(s):"
          cat SHA256SUMS
          printf '%s\n' "${ASSETS[@]}" > /tmp/release-assets.txt

      # The producer checked by the consumer. If verify.sh and the emit step
      # ever disagree about the format, this is where it surfaces — in a red
      # release job, not in a user's terminal after the release is public.
      - name: Verify SHA256SUMS with the same script users run
        run: |
          set -euo pipefail
          mapfile -t ASSETS < /tmp/release-assets.txt
          bash scripts/verify.sh --dir release "${ASSETS[@]}"

      # Proves the verifier's refusals still fire on this runner, on this
      # release, before anything is published. A verifier whose failure paths
      # are never exercised is a verifier that has probably stopped failing.
      - name: Prove the verifier still refuses broken releases
        run: bash scripts/verify.sh --selftest

      # Short-lived sigstore cert from this job's OIDC identity. No secret is
      # referenced here and none needs to exist. Attests every file in
      # release/, including SHA256SUMS itself — so an attestation on the
      # manifest transitively covers every asset the manifest names.
      - name: Attest build provenance (sigstore via OIDC — no long-lived key)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # draft: leave as published so dependents can resolve it immediately.
          generate_release_notes: true
          body: |
            ### Verify before you run this

            ```sh
            curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/verify.sh
            bash verify.sh --tag ${{ github.ref_name }} --attest relay-client-${{ github.ref_name }}-dist.tar.gz
            ```

            `verify.sh` fetches `SHA256SUMS`, looks up the exact entry for the
            asset and compares digests; it exits non-zero, with a distinct
            diagnostic, on a missing or malformed manifest, a missing entry, a
            truncated download or a digest mismatch. There is no skip path.
            `--attest` additionally checks the sigstore build provenance
            (needs the `gh` CLI); without it, provenance is NOT checked and the
            script says so.
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
