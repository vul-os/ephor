name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  client:
    name: Client — Build & Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The unit suite imports from client/src and runs in jsdom, so it cannot
      # see a broken BUILD OUTPUT. This package is a library: Office, Meet and
      # Talk import the BUILT dist-lib/ — a built entry that throws on load takes
      # THEIR app blank while everything here stays green. Boot a real consumer
      # harness (which imports pier-client through the exports map) in
      # chromium.
      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # `test:e2e` → pretest:e2e → build (lib + types) + build:harness
      - name: Built-library boot guard (real browser)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pier-client-playwright-report
          path: client/playwright-report/
          retention-days: 7

  go:
    name: Relay Server — Build, Vet & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test ./... -race

  rust:
    name: Rust Workspace — Build, Test, Clippy & Fmt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # This repo publishes NOTHING to crates.io (see the PUBLISH RULE in the root
      # Cargo.toml). scripts/check-no-publish.sh enforces that — and until now it was
      # enforced only by whoever remembered to run it by hand, which is not enforcement.
      # It is pure bash (grep only, no toolchain), so it runs before the rustup install
      # and fails fast.
      - name: No-publish rule
        run: ./scripts/check-no-publish.sh

      # rust-version in [workspace.package] is 1.85; build on stable and let the
      # rust-version floor be what it is — a MSRV job is a separate concern.
      - name: Set up Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # The workspace now path-depends on the SIBLING kotva checkout: `crates/pier-cli`
      # depends on `kotva-depot` (the closed §5.2 ability registry it is a client for),
      # and `crates/pier-infra-service` dev-depends on it. Neither can use the
      # `git = ".../kotva", tag = "core-v0.2.0"` convention the other crates use, because
      # that tag PREDATES the crate — `git ls-tree core-v0.2.0 crates/` lists only
      # kotva-core and kotva-mail. So kotva must exist next to this checkout or `cargo
      # metadata` itself fails, before any build step runs.
      #
      # Pinned to an immutable SHA, not a branch: the isango guardrail (HANDOVER
      # §Guardrails-1) is "never track HEAD", and a SHA satisfies it exactly as a tag
      # does. DELETE THIS STEP the moment kotva cuts a tag containing kotva-depot; the
      # path deps become `{ git = ..., tag = ... }` and the sibling stops being needed.
      - name: Fetch the kotva sibling (pinned)
        run: |
          set -euo pipefail
          KOTVA_SHA=17b7edd1ba63e86d5a98b80cf426c9c89be83424
          DEST="$(dirname "$GITHUB_WORKSPACE")/kotva"
          mkdir -p "$DEST"
          git -C "$DEST" init -q
          git -C "$DEST" remote add origin https://github.com/vul-os/kotva.git
          git -C "$DEST" fetch -q --depth 1 origin "$KOTVA_SHA"
          git -C "$DEST" checkout -q FETCH_HEAD
          # Assert the thing we came for is actually there. A clone that succeeded but
          # produced the wrong tree would otherwise surface as an inscrutable cargo error
          # three steps later.
          for c in kotva-depot kotva-core kotva-cbor; do
            test -f "$DEST/crates/$c/Cargo.toml" || {
              echo "::error::kotva sibling is missing crates/$c — the pin is wrong or the crate moved"
              exit 1
            }
          done
          echo "kotva pinned at ${KOTVA_SHA} in ${DEST}"

      # THE COVERAGE ASSERTION. This job would otherwise be trivially satisfiable
      # by a workspace that resolved to zero crates: `cargo build` over an empty
      # member list exits 0 and reports nothing. Pin the crate count, print the
      # names, and name out loud the one crate this job does NOT cover.
      #
      # Bump EXPECTED_CRATES deliberately when a coordinator kind is added.
      # 14 -> 15: crates/pier-cli (the DEPOT control-plane CLI).
      - name: Coverage guard (crate count)
        run: |
          set -euo pipefail
          EXPECTED_CRATES=15
          cargo metadata --no-deps --format-version 1 --locked > /tmp/meta.json
          ACTUAL=$(jq '.packages | length' /tmp/meta.json)
          echo "Workspace crates this job builds/tests/lints (${ACTUAL}):"
          jq -r '.packages[] | "  - \(.name) \(.version)"' /tmp/meta.json | sort
          if [ "$ACTUAL" -ne "$EXPECTED_CRATES" ]; then
            echo "::error::Rust CI resolved ${ACTUAL} workspace crates, expected ${EXPECTED_CRATES}."
            echo "::error::Either a crate was added (bump EXPECTED_CRATES here, deliberately) or the"
            echo "::error::workspace member list silently shrank and this job stopped covering it."
            exit 1
          fi
          # The honest-exclusion notice. It names a path, so it must be a path that
          # EXISTS: it said "crates/broker-billing-patala", from before the rename to
          # pier, and no crate has been called broker-* since. A reader following
          # "See .../Cargo.toml" landed on nothing, which quietly turns a disclosure of
          # a coverage gap into a dead reference. Assert the path rather than print it,
          # so the next rename fails the job instead of rotting the message.
          EXCLUDED_CRATE=crates/pier-billing-patala
          if [ ! -f "$EXCLUDED_CRATE/Cargo.toml" ]; then
            echo "::error::This job's coverage notice names ${EXCLUDED_CRATE}, which does not exist."
            echo "::error::Either the crate moved/was renamed (update EXCLUDED_CRATE here) or it was"
            echo "::error::deleted (drop this notice). A disclosure that points at nothing discloses nothing."
            exit 1
          fi
          echo "NOT VERIFIED BY THIS JOB: ${EXCLUDED_CRATE} (the optional patala-backed"
          echo "SettlementRail adapter, 11 tests). It is 'exclude'd from this workspace because it"
          echo "path-depends on the sibling ../../../patala repo, which is NOT checked out here."
          echo "Its build, tests, clippy and fmt are UNVERIFIED in CI. See ${EXCLUDED_CRATE}/Cargo.toml."

      # --locked everywhere: a CI run that silently rewrites Cargo.lock is not
      # testing what the repo pins.
      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: |
          set -euo pipefail
          # Floor, not an exact match — this fails when tests DISAPPEAR, which is the
          # failure mode a green-by-doing-nothing gate hides. Raise it when the suite grows.
          # 561 -> 600: crates/pier-cli contributes 39 (31 unit + 8 ability-mapping).
          MIN_TESTS=600
          cargo test --locked --no-fail-fast 2>&1 | tee /tmp/cargo-test.log
          PASSED=$(grep -E '^test result: ok\.' /tmp/cargo-test.log | awk '{ n += $4 } END { print n+0 }')
          echo "Rust tests passed: ${PASSED} (floor ${MIN_TESTS})"
          if [ "$PASSED" -lt "$MIN_TESTS" ]; then
            echo "::error::Only ${PASSED} Rust tests ran; expected at least ${MIN_TESTS}."
            echo "::error::Tests were deleted, or a crate's suite stopped being discovered."
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rustfmt
        run: cargo fmt --all --check

  # The operator console had NO CI job at all. `check-brand-isolation.sh` and its
  # mutation suite were reachable only as `pnpm check:brand` / `check:brand:mutate`,
  # i.e. only when a human remembered — so the console could ship a Vulos string, or
  # a stale pre-rename one, on any push and nothing would say so. A gate nothing invokes
  # is documentation, not a gate.
  #
  # This mirrors the verify-script job's principle one level up: run the gate AND run
  # the mutation suite that proves the gate can still fail.
  console:
    name: Operator Console — Types, Build & Brand Isolation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      # Node 22, not the 20 the client job uses: vite 8 declares
      # engines.node "^20.19.0 || >=22.12.0". Do not lower this without checking that.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      # --frozen-lockfile: an install that silently resolves different versions is not
      # testing what the repo pins (same reason the Rust job passes --locked).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      # The gate itself: builds the DEFAULT target (VITE_BRAND unset) and asserts no
      # file in dist/ names another brand, with its own coverage assertions.
      - name: Brand isolation gate
        run: pnpm check:brand

      # The evidence the gate can fail. Six defect classes, each planted then reverted.
      - name: Brand isolation — mutation suite
        run: pnpm check:brand:mutate

      # The mutation suite edits tracked files and restores them from a trap. If that
      # restore ever half-works, every later run of the gate would be scoring a tree
      # nobody intended. Assert the working tree came back exactly as checked out.
      - name: Working tree must be restored after mutation
        working-directory: .
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "::error::the mutation suite did not restore the working tree:"
            git --no-pager diff --stat
            exit 1
          fi
          echo "working tree clean — the mutation suite restored every file it touched"

  # docs/ and site/docs/ are the same twelve documents kept by hand, with no
  # generator and no sync step. Duplication like that does not fail loudly; it drifts.
  # Two of the twelve had already diverged before anything checked.
  docs:
    name: Docs — docs/ vs site/docs/ duplication
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pure node, no dependencies — nothing to install.
      - name: Doc duplication drift
        run: node scripts/check-doc-duplication.mjs

  # The release verifier is only worth having if its REFUSALS are exercised.
  # A checksum guard that has quietly stopped failing looks identical, from a
  # green CI run, to one that works. This runs the full synthetic-origin matrix
  # on every push, not just at release time.
  verify-script:
    name: Release Verifier — Lint & Failure Matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # Each case is a synthetic origin broken in exactly one way; the matrix
      # asserts the exit code AND that a diagnostic was printed, because
      # "aborted with no message" was the real-world bug being guarded against.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    needs: [client, go, rust, console, docs, verify-script]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
        continue-on-error: true
